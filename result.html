<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Detection Result</title>
  <style>
    body { font-family: Arial; background: #f0f2f5; margin: 0; padding: 0; }
    .box {
      max-width: 700px; margin: 60px auto;
      background: white; padding: 40px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }
    .safe { color: green; font-size: 20px; }
    .deadlock { color: red; font-size: 20px; }
    a {
      margin-top: 20px; display: inline-block;
      text-decoration: none; color: #0069ff;
    }
  </style>
</head>
<body>
  <div class="box">
    <h2>Detection Result</h2>
    {% if result.terminated|length == 0 %}
      <p class="safe">✅ No Deadlock Detected. System is Safe.</p>
    {% else %}
      <p class="deadlock">⚠️ Deadlock was Detected.</p>
      <p class="safe">✅ Recovery Successful. Terminated processes: {{ result.terminated | join(", ") }}</p>
    {% endif %}
    <a href="/">← Back to Home</a>
  </div>
</body>
</html>
