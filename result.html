<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simulation Result</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #0077cc;
      padding: 30px;
      color: white;
      text-align: center;
      font-size: 26px;
      font-weight: bold;
    }
    main {
      max-width: 700px;
      margin: 40px auto;
      background: white;
      padding: 40px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .result {
      font-size: 22px;
      font-weight: bold;
      color: #333;
    }
    .deadlock {
      color: #b30000;
    }
    .safe {
      color: #008000;
    }
    a {
      margin-top: 20px;
      display: inline-block;
      text-decoration: none;
      color: #0077cc;
    }
  </style>
</head>
<body>

  <header>
    Simulation Result
  </header>

  <main>
    {% if deadlock %}
      <div class="result deadlock">⚠️ Deadlock Detected in the System!</div>
    {% else %}
      <div class="result safe">✅ No Deadlock Detected. The system is safe.</div>
    {% endif %}
    <a href="/">← Run Another Simulation</a>
  </main>

</body>
</html>
